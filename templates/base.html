<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TERRA ALERT{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <header class="topbar">
        <a class="brand" href="{{ url_for('dashboard') }}">
            <span class="brand-icon">◉</span>
            TERRA <strong>ALERT</strong>
        </a>

        <nav class="main-nav">
            <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
                INICIO
            </a>

            <a href="{{ url_for('analysis') }}" class="{% if request.endpoint == 'analysis' %}active{% endif %}">
                ANÁLISIS
            </a>

            <a href="{{ url_for('events') }}" class="{% if request.endpoint == 'events' %}active{% endif %}">
                EVENTOS
            </a>
        </nav>

        <div class="topbar-info">
            <span class="live-dot"></span>
            OBSERVATORIO GLOBAL
            <span class="period">1900 — 2025</span>
        </div>
    </header>

    <main class="dashboard">
        {% block content %}{% endblock %}

        <footer>
            <p>
                TERRA ALERT · Proyecto educativo de análisis de desastres naturales
            </p>
            <p>
                Fuente de datos: EM-DAT · Periodo de estudio: 1900–2025
            </p>
        </footer>
    </main>

    {% block scripts %}{% endblock %}

</body>

</html>
